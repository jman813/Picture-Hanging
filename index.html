<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artwork Hanging Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall: #E7E2D7;
    --card: #FBFAF6;
    --ink: #2A2620;
    --ink-soft: #786F62;
    --line: #DAD3C4;
    --frame: #3B342C;
    --mat: #F4F1E9;
    --brass: #A87C2E;
    --brass-soft: #F1E4C6;
    --crayon: #B23A2E;
    --crayon-soft: #F3DCD8;
    --ok: #4B6B4F;
    --info: #5A6B78;
    --info-soft: #E4EAEE;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--wall);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 560px; margin:0 auto; padding: 20px 16px 40px; }
  header{ margin-bottom: 18px; }
  h1{
    font-family: 'Bebas Neue','Inter',sans-serif;
    font-size: 34px;
    letter-spacing: 0.5px;
    margin:0;
    line-height:1;
  }
  .sub{ color: var(--ink-soft); font-size: 13.5px; margin-top: 6px; }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .field-grid{ display:grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 460px){
    .field-grid{ grid-template-columns: 1fr 1fr; }
    .field-grid .full{ grid-column: 1 / -1; }
  }
  label{
    display:block; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 5px;
  }
  .input-row{
    display:flex; align-items:center;
    border: 1px solid var(--line); border-radius: 7px;
    background:#fff; overflow:hidden;
  }
  .input-row input{
    border:0; outline:none; padding: 10px 10px;
    font-family:'IBM Plex Mono',monospace; font-size: 15px;
    width: 100%; background: transparent; color: var(--ink);
  }
  .input-row .unit{
    padding: 0 10px; font-size: 12.5px; color: var(--ink-soft);
    border-left: 1px solid var(--line); white-space:nowrap;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ opacity:0.5; }

  .seg{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff; }
  .seg button{
    flex:1; padding: 9px 6px; border:0; background:transparent;
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
    color: var(--ink-soft); cursor:pointer; border-right:1px solid var(--line);
  }
  .seg button:last-child{ border-right:0; }
  .seg button.active{ background: var(--frame); color:#fff; }
  .seg.small button{ padding: 7px 6px; font-size: 12.5px; }

  .section-title{
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .section-head{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
  }
  .section-head .section-title{ margin-bottom: 0; }
  .link-btn{
    border: 1px solid var(--line); background: #fff; color: var(--frame);
    font-family:'Inter',sans-serif; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .link-btn:hover{ background: var(--brass-soft); }

  .picture-block{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .picture-block:last-child{ margin-bottom: 0; }
  .picture-block-head{
    display:flex; align-items:center; gap:8px; margin-bottom: 10px;
  }
  .chip{
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--frame); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-size: 12px; font-weight: 600;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .picture-block-head .name{ font-size: 13px; font-weight: 600; flex: 1; }
  .picture-fields{
    display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  }
  .picture-fields label{ font-size: 11px; margin-bottom: 4px; }
  .picture-fields .input-row input{ padding: 8px; font-size: 13.5px; }
  .hooks-row{
    display:flex; align-items:center; gap: 10px; margin-top: 10px;
    padding-top: 10px; border-top: 1px dashed var(--line);
  }
  .hooks-row .seg{ max-width: 140px; }
  .hooks-row label{ margin-bottom: 0; white-space: nowrap; }
  .hook-spacing-field{ flex:1; }
  .hook-spacing-field label{ font-size: 11px; margin-bottom: 4px; }

  .end-gap-row{
    display:flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .end-gap-row .stat-label{ font-size: 13px; }
  .end-gap-row .stat-value{ font-size: 15px; }

  .gap-row{
    display:flex; align-items:center; gap: 10px; padding: 6px 0;
  }
  .gap-row label{ flex:1; margin-bottom:0; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .gap-row .input-row{ width: 130px; flex-shrink: 0; }
  .gap-row .input-row input{ padding: 7px 8px; font-size: 13.5px; }

  svg{ display:block; width:100%; height:auto; }

  .warn{
    margin-top: 10px; font-size: 13px; color: var(--crayon);
    background: var(--crayon-soft); border-radius: 6px; padding: 8px 10px; display:none;
  }
  .warn.show{ display:block; }
  .note{
    font-size: 13px; color: var(--info);
    background: var(--info-soft); border-radius: 6px; padding: 8px 10px;
  }

  .stat-row{
    display:flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .stat-row:last-child{ border-bottom:0; }
  .stat-label{ font-size: 13.5px; color: var(--ink-soft); }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size: 15.5px; font-weight: 600; }
  .stat-value.ok{ color: var(--ok); }
  .stat-value.bad{ color: var(--crayon); }

  .hook-row{
    display:flex; align-items:flex-start; padding: 10px 0;
    border-bottom: 1px solid var(--line); gap: 12px;
  }
  .hook-row:last-child{ border-bottom:0; }
  .hook-num{
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--brass); color:#fff;
    font-family:'IBM Plex Mono',monospace; font-size: 12px; font-weight:600;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top: 2px;
  }
  .hook-info{ flex:1; }
  .hook-dims{ display:flex; gap: 18px; flex-wrap: wrap; margin-top: 3px; }
  .hook-dim-label{ font-size: 11.5px; color: var(--ink-soft); }
  .hook-dim-value{ font-family:'IBM Plex Mono',monospace; font-size: 15px; font-weight:600; }
  .hook-size{ font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HANGING PLAN</h1>
    <div class="sub">Lays out artwork across a wall and finds each hook position.</div>
  </header>

  <div class="card">
    <div class="field-grid">
      <div>
        <label for="wallLength">Wall length</label>
        <div class="input-row">
          <input type="text" inputmode="decimal" id="wallLength" value="3000">
          <span class="unit" id="u1">mm</span>
        </div>
      </div>
      <div>
        <label for="eyeHeight" id="eyeHeightLabel">Picture centre height</label>
        <div class="input-row">
          <input type="text" inputmode="decimal" id="eyeHeight" value="1600">
          <span class="unit" id="u2">mm</span>
        </div>
      </div>
      <div class="full">
        <label>Vertical alignment</label>
        <div class="seg" id="alignSeg">
          <button data-val="centre" class="active">Level centres</button>
          <button data-val="top">Level tops</button>
          <button data-val="bottom">Level bottoms</button>
        </div>
      </div>
      <div>
        <label for="count">Number of pictures</label>
        <div class="input-row">
          <input type="text" inputmode="numeric" id="count" value="3">
        </div>
      </div>
      <div>
        <label for="unit">Unit label</label>
        <div class="input-row">
          <input type="text" id="unit" value="mm">
        </div>
      </div>
      <div class="full">
        <label>Measure horizontal distance from</label>
        <div class="seg" id="endSeg">
          <button data-val="left" class="active">Left end of wall</button>
          <button data-val="right">Right end of wall</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">PICTURES, LEFT TO RIGHT</div>
    <div id="pictureFields"></div>
  </div>

  <div class="card">
    <div class="section-head">
      <div class="section-title">SPACING</div>
      <button class="link-btn" id="distributeBtn">Reset to even</button>
    </div>
    <div class="end-gap-row">
      <div class="stat-label">End gap (each side, calculated)</div>
      <div class="stat-value" id="statEndGap">—</div>
    </div>
    <div id="gapFields"></div>
  </div>

  <div class="card">
    <div class="section-title">WALL ELEVATION</div>
    <div id="svgHolder"></div>
    <div class="warn" id="warnBox"></div>
  </div>

  <div class="card">
    <div class="stat-row">
      <div class="stat-label">Total length used</div>
      <div class="stat-value" id="statUsed">—</div>
    </div>
    <div class="stat-row" id="statAvgRow" style="display:none;">
      <div class="stat-label">Average picture height</div>
      <div class="stat-value" id="statAvgHeight">—</div>
    </div>
    <div class="stat-row" id="statSharedRow" style="display:none;">
      <div class="stat-label" id="statSharedLabel">Shared level</div>
      <div class="stat-value" id="statSharedLevel">—</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">HOOK POSITIONS</div>
    <div id="hookList"></div>
  </div>
</div>

<script>
const wallLengthInput = document.getElementById('wallLength');
const eyeHeightInput = document.getElementById('eyeHeight');
const countInput = document.getElementById('count');
const unitInput = document.getElementById('unit');
const endSeg = document.getElementById('endSeg');
const pictureFieldsEl = document.getElementById('pictureFields');
const gapFieldsEl = document.getElementById('gapFields');
const distributeBtn = document.getElementById('distributeBtn');
const svgHolder = document.getElementById('svgHolder');
const warnBox = document.getElementById('warnBox');
const statEndGap = document.getElementById('statEndGap');
const statUsed = document.getElementById('statUsed');
const hookListEl = document.getElementById('hookList');

// Selecting existing text on focus means typing a new value replaces it
// instead of appending to it -- applies to every input, present and future.
document.addEventListener('focusin', (e) => {
  if(e.target.tagName === 'INPUT'){
    e.target.select();
  }
});

let measureFrom = 'left';
let heightAlignment = 'centre'; // 'centre' | 'top' | 'bottom'
let pictures = [
  { width: 500, height: 700, drop: 60, hooks: 1, hookSpacing: 300 },
  { width: 500, height: 700, drop: 60, hooks: 1, hookSpacing: 300 },
  { width: 500, height: 700, drop: 60, hooks: 1, hookSpacing: 300 },
];
// betweenGaps has length (n-1): the gap between each adjacent pair of pictures.
// These are the only spacing values a person edits directly.
// The two end gaps (before the first picture, after the last) are never
// stored -- they're always derived so the layout keeps filling the wall.
let betweenGaps = [];

endSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  measureFrom = btn.dataset.val;
  [...endSeg.children].forEach(b => b.classList.toggle('active', b === btn));
  render();
});

const alignSeg = document.getElementById('alignSeg');
const eyeHeightLabel = document.getElementById('eyeHeightLabel');
alignSeg.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  heightAlignment = btn.dataset.val;
  [...alignSeg.children].forEach(b => b.classList.toggle('active', b === btn));
  eyeHeightLabel.textContent = heightAlignment === 'centre'
    ? 'Picture centre height'
    : `Average centre height (sets the shared ${heightAlignment})`;
  render();
});

distributeBtn.addEventListener('click', () => {
  resetSpacingToEven();
  buildGapFields();
  render();
});

function evenBetweenGapValue(){
  const L = parseFloat(wallLengthInput.value) || 0;
  const sumWidths = pictures.reduce((s,p) => s + (parseFloat(p.width) || 0), 0);
  const n = pictures.length;
  return (L - sumWidths) / (n + 1);
}

function resetSpacingToEven(){
  const n = pictures.length;
  const g = evenBetweenGapValue();
  betweenGaps = new Array(Math.max(n - 1, 0)).fill(g);
}

function syncPictureCount(){
  let n = parseInt(countInput.value, 10);
  if(!Number.isInteger(n) || n < 1) return;
  if(n > 30){ n = 30; countInput.value = 30; }
  while(pictures.length < n){
    const last = pictures[pictures.length - 1] || { width: 500, height: 700, drop: 60, hooks: 1, hookSpacing: 300 };
    pictures.push({ ...last });
  }
  pictures.length = n;
  resetSpacingToEven();
  buildPictureFields();
  buildGapFields();
}

function buildPictureFields(){
  const unit = unitInput.value || '';
  pictureFieldsEl.innerHTML = pictures.map((p, i) => `
    <div class="picture-block">
      <div class="picture-block-head">
        <div class="chip">${i+1}</div>
        <div class="name">Picture ${i+1}</div>
      </div>
      <div class="picture-fields">
        <div>
          <label>Width (${unit})</label>
          <div class="input-row"><input type="text" inputmode="decimal" data-idx="${i}" data-field="width" value="${p.width}"></div>
        </div>
        <div>
          <label>Height (${unit})</label>
          <div class="input-row"><input type="text" inputmode="decimal" data-idx="${i}" data-field="height" value="${p.height}"></div>
        </div>
        <div>
          <label>Wire to top (${unit})</label>
          <div class="input-row"><input type="text" inputmode="decimal" data-idx="${i}" data-field="drop" value="${p.drop}"></div>
        </div>
      </div>
      <div class="hooks-row">
        <label>Hooks</label>
        <div class="seg small hooks-seg" data-idx="${i}">
          <button data-val="1" class="${p.hooks === 1 ? 'active' : ''}">1</button>
          <button data-val="2" class="${p.hooks === 2 ? 'active' : ''}">2</button>
        </div>
        <div class="hook-spacing-field" style="${p.hooks === 2 ? '' : 'display:none;'}" data-spacing-wrap="${i}">
          <label>Spacing between hooks (${unit})</label>
          <div class="input-row"><input type="text" inputmode="decimal" data-idx="${i}" data-field="hookSpacing" value="${p.hookSpacing}"></div>
        </div>
      </div>
    </div>
  `).join('');

  pictureFieldsEl.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.idx, 10);
      const field = inp.dataset.field;
      pictures[idx][field] = parseFloat(inp.value);
      if(field === 'width'){
        // a width change shifts how much space is available, so spacing
        // defaults back to even rather than keeping a now-stale custom layout
        resetSpacingToEven();
        buildGapFields();
      }
      render();
    });
  });

  pictureFieldsEl.querySelectorAll('.hooks-seg').forEach(seg => {
    seg.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if(!btn) return;
      const idx = parseInt(seg.dataset.idx, 10);
      const val = parseInt(btn.dataset.val, 10);
      pictures[idx].hooks = val;
      [...seg.children].forEach(b => b.classList.toggle('active', b === btn));
      const wrap = pictureFieldsEl.querySelector(`[data-spacing-wrap="${idx}"]`);
      if(wrap) wrap.style.display = val === 2 ? '' : 'none';
      render();
    });
  });
}

function buildGapFields(){
  const n = pictures.length;
  if(n <= 1){
    gapFieldsEl.innerHTML = `<div class="note">Single picture — centred automatically on the wall.</div>`;
    return;
  }
  const rows = [];
  for(let i = 0; i < n - 1; i++){
    rows.push(`
      <div class="gap-row">
        <label>Between Picture ${i+1} & ${i+2}</label>
        <div class="input-row"><input type="text" inputmode="decimal" data-gidx="${i}" value="${fmtRaw(betweenGaps[i])}"></div>
      </div>
    `);
  }
  gapFieldsEl.innerHTML = rows.join('');
  gapFieldsEl.querySelectorAll('input[data-gidx]').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.gidx, 10);
      // editing one between-gap only changes that value -- the two end gaps
      // (calculated, not stored) absorb the difference automatically
      betweenGaps[idx] = parseFloat(inp.value);
      render();
    });
  });
}

function fmtRaw(n){
  if(n === null || n === undefined || isNaN(n)) return '';
  return Math.round(n * 100) / 100;
}

let lastProcessedCount = pictures.length;
function onCountChanged(){
  const n = parseInt(countInput.value, 10);
  if(n === lastProcessedCount) return; // avoid rebuilding (and stealing focus) when nothing actually changed
  syncPictureCount();
  lastProcessedCount = pictures.length;
  render();
}
countInput.addEventListener('input', onCountChanged);
countInput.addEventListener('change', onCountChanged);

function onWallOrEyeChanged(){
  resetSpacingToEven();
  buildGapFields();
  render();
}
wallLengthInput.addEventListener('input', onWallOrEyeChanged);
eyeHeightInput.addEventListener('input', render); // eye height doesn't affect horizontal spacing

unitInput.addEventListener('input', () => {
  document.getElementById('u1').textContent = unitInput.value || '';
  document.getElementById('u2').textContent = unitInput.value || '';
  buildPictureFields();
  buildGapFields();
  render();
});

function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return (Math.round(n * 100) / 100).toLocaleString(undefined, {maximumFractionDigits: 2});
}

function computeLayout(){
  const L = parseFloat(wallLengthInput.value);
  const eyeHeight = parseFloat(eyeHeightInput.value);
  const n = pictures.length;

  if(!(L > 0) || !(eyeHeight >= 0) || n < 1) return null;
  for(const p of pictures){
    if(!(p.width > 0) || !(p.height > 0) || isNaN(p.drop)) return null;
  }
  const expectedBetweenLen = Math.max(n - 1, 0);
  if(betweenGaps.length !== expectedBetweenLen || betweenGaps.some(g => isNaN(g))) return null;

  const sumWidths = pictures.reduce((s,p) => s + p.width, 0);
  const sumBetween = betweenGaps.reduce((s,g) => s + g, 0);
  const remaining = L - sumWidths - sumBetween;
  const endGap = remaining / 2;
  const overflow = -remaining; // positive means the layout doesn't fit
  const anyNegativeBetween = betweenGaps.some(g => g < -1e-9);

  const avgHeight = pictures.reduce((s,p) => s + p.height, 0) / n;
  // The shared level used when tops or bottoms are lined up: using the
  // *average* height keeps the group's overall visual centre at eyeHeight,
  // even though individual pictures no longer centre on it themselves.
  let sharedLevel = eyeHeight;
  if(heightAlignment === 'top') sharedLevel = eyeHeight + avgHeight / 2;
  else if(heightAlignment === 'bottom') sharedLevel = eyeHeight - avgHeight / 2;

  let cursor = endGap;
  const laidOut = pictures.map((p, i) => {
    const left = cursor;
    const centre = left + p.width / 2;
    cursor = left + p.width + (i < betweenGaps.length ? betweenGaps[i] : 0);

    let top, bottom;
    if(heightAlignment === 'top'){
      top = sharedLevel;
      bottom = top - p.height;
    } else if(heightAlignment === 'bottom'){
      bottom = sharedLevel;
      top = bottom + p.height;
    } else {
      top = eyeHeight + p.height / 2;
      bottom = eyeHeight - p.height / 2;
    }
    const hookHeight = top - p.drop; // hook always sits "drop" below the frame's top edge
    const hookXs = p.hooks === 2
      ? [centre - p.hookSpacing / 2, centre + p.hookSpacing / 2]
      : [centre];
    const spacingExceedsWidth = p.hooks === 2 && p.hookSpacing > p.width;
    return { ...p, left, centre, top, bottom, hookHeight, hookXs, spacingExceedsWidth };
  });

  return { L, eyeHeight, n, sumWidths, endGap, overflow, anyNegativeBetween, avgHeight, sharedLevel, pictures: laidOut, usedLength: sumWidths + sumBetween + endGap * 2 };
}

function render(){
  const result = computeLayout();
  const unit = unitInput.value || '';

  if(!result){
    svgHolder.innerHTML = '';
    warnBox.classList.add('show');
    warnBox.textContent = 'Enter a valid wall length, centre height, and positive width/height for every picture, and a number for every gap.';
    statEndGap.textContent = '—';
    statUsed.textContent = '—';
    hookListEl.innerHTML = '';
    return;
  }

  const { L, eyeHeight, endGap, overflow, anyNegativeBetween, avgHeight, sharedLevel, pictures: laidOut, usedLength } = result;
  const fits = endGap >= -1e-9;

  const spacingWarnings = laidOut.filter(p => p.spacingExceedsWidth);
  let warnMsg = '';
  if(overflow > 1e-6){
    warnMsg = `Layout overflows the wall by ${fmt(overflow)} ${unit}. Reduce a width or a between-picture gap.`;
  } else if(anyNegativeBetween){
    warnMsg = `One of the between-picture gaps is negative — those pictures would overlap.`;
  }
  if(spacingWarnings.length){
    const list = spacingWarnings.map(p => laidOut.indexOf(p) + 1).join(', ');
    const msg = `Hook spacing is wider than the picture for Picture ${list} — hooks would sit outside the frame edge.`;
    warnMsg = warnMsg ? warnMsg + ' ' + msg : msg;
  }
  if(warnMsg){
    warnBox.classList.add('show');
    warnBox.textContent = warnMsg;
  } else {
    warnBox.classList.remove('show');
  }

  statEndGap.textContent = `${fmt(endGap)} ${unit}`;
  statEndGap.className = 'stat-value' + (fits ? ' ok' : ' bad');
  statUsed.textContent = `${fmt(usedLength)} ${unit} of ${fmt(L)} ${unit}`;

  const statAvgRow = document.getElementById('statAvgRow');
  const statSharedRow = document.getElementById('statSharedRow');
  if(heightAlignment === 'centre'){
    statAvgRow.style.display = 'none';
    statSharedRow.style.display = 'none';
  } else {
    statAvgRow.style.display = 'flex';
    statSharedRow.style.display = 'flex';
    document.getElementById('statAvgHeight').textContent = `${fmt(avgHeight)} ${unit}`;
    document.getElementById('statSharedLabel').textContent = heightAlignment === 'top' ? 'Shared top height' : 'Shared bottom height';
    document.getElementById('statSharedLevel').textContent = `${fmt(sharedLevel)} ${unit}`;
  }

  // ---- SVG elevation ----
  const vbW = 640;
  const padX = 16;
  const drawW = vbW - padX * 2;
  const scale = L > 0 ? drawW / L : 0;

  const maxTop = Math.max(eyeHeight, sharedLevel, ...laidOut.map(p => p.top));
  const vMarginTopMM = 120;
  const floorMarginPx = 26;
  const topMarginPx = 14;

  const vbHeightMM = maxTop + vMarginTopMM;
  const drawH = vbHeightMM * scale;
  const vbH = drawH + floorMarginPx + topMarginPx;
  const floorY = vbH - floorMarginPx;

  const mmToY = (mm) => floorY - mm * scale;

  let framesSvg = '';
  laidOut.forEach((p, i) => {
    const x = padX + p.left * scale;
    const w = p.width * scale;
    const yTop = mmToY(p.top);
    const yBottom = mmToY(p.bottom);
    const h = yBottom - yTop;
    const frameTopInnerY = yTop + h * 0.08;

    framesSvg += `
      <rect x="${x.toFixed(2)}" y="${yTop.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="#3B342C" stroke="#211C17" stroke-width="1"/>
      <rect x="${(x+w*0.08).toFixed(2)}" y="${(yTop+h*0.08).toFixed(2)}" width="${(w*0.84).toFixed(2)}" height="${(h*0.84).toFixed(2)}" fill="#F4F1E9"/>
      <rect x="${(x+4).toFixed(2)}" y="${(yTop+4).toFixed(2)}" width="16" height="16" rx="3" fill="#A87C2E"/>
      <text x="${(x+12).toFixed(2)}" y="${(yTop+15.5).toFixed(2)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#fff">${i+1}</text>
    `;

    p.hookXs.forEach(hx => {
      const hookX = padX + hx * scale;
      const hookY = mmToY(p.hookHeight);
      framesSvg += `
        <line x1="${hookX.toFixed(2)}" y1="${hookY.toFixed(2)}" x2="${hookX.toFixed(2)}" y2="${frameTopInnerY.toFixed(2)}" stroke="#A87C2E" stroke-width="1.2" stroke-dasharray="2 2"/>
        <circle cx="${hookX.toFixed(2)}" cy="${hookY.toFixed(2)}" r="4" fill="#A87C2E" stroke="#7A5A20" stroke-width="1"/>
        <line x1="${hookX.toFixed(2)}" y1="${floorY.toFixed(2)}" x2="${hookX.toFixed(2)}" y2="${(floorY+6).toFixed(2)}" stroke="#786F62" stroke-width="1"/>
      `;
    });
  });

  const eyeY = mmToY(eyeHeight);
  let refLine = `
    <line x1="${padX}" y1="${eyeY.toFixed(2)}" x2="${padX+drawW}" y2="${eyeY.toFixed(2)}" stroke="#786F62" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="${padX+4}" y="${(eyeY-5).toFixed(2)}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#786F62">${heightAlignment === 'centre' ? 'centre' : 'average centre'} line, ${fmt(eyeHeight)} ${unit}</text>
  `;
  if(heightAlignment !== 'centre'){
    const sharedY = mmToY(sharedLevel);
    const sharedLabel = heightAlignment === 'top' ? 'shared top line' : 'shared bottom line';
    refLine += `
      <line x1="${padX}" y1="${sharedY.toFixed(2)}" x2="${padX+drawW}" y2="${sharedY.toFixed(2)}" stroke="#A87C2E" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.8"/>
      <text x="${padX+4}" y="${(sharedY-5).toFixed(2)}" font-family="IBM Plex Mono, monospace" font-size="10" fill="#A87C2E">${sharedLabel}, ${fmt(sharedLevel)} ${unit}</text>
    `;
  }

  const floorLine = `<line x1="${padX}" y1="${floorY.toFixed(2)}" x2="${padX+drawW}" y2="${floorY.toFixed(2)}" stroke="#2A2620" stroke-width="1.5"/>`;

  const svg = `
    <svg viewBox="0 0 ${vbW} ${vbH.toFixed(2)}" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="${vbW}" height="${vbH.toFixed(2)}" fill="#EFEAE0"/>
      ${refLine}
      ${framesSvg}
      ${floorLine}
    </svg>
  `;
  svgHolder.innerHTML = svg;

  // ---- Hook list ----
  hookListEl.innerHTML = laidOut.map((p, i) => {
    const sizeLine = `Picture ${i+1} — ${fmt(p.width)} × ${fmt(p.height)} ${unit}`;
    if(p.hooks === 1){
      const horiz = measureFrom === 'left' ? p.centre : (L - p.centre);
      const endLabel = measureFrom === 'left' ? 'from left end' : 'from right end';
      return `
        <div class="hook-row">
          <div class="hook-num">${i+1}</div>
          <div class="hook-info">
            <div class="hook-size">${sizeLine} — 1 hook</div>
            <div class="hook-dims">
              <div>
                <div class="hook-dim-label">Hook, ${endLabel}</div>
                <div class="hook-dim-value">${fmt(horiz)} ${unit}</div>
              </div>
              <div>
                <div class="hook-dim-label">Hook height above floor</div>
                <div class="hook-dim-value">${fmt(p.hookHeight)} ${unit}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else {
      const labels = ['a','b'];
      const subRows = p.hookXs.map((hx, hi) => {
        const horiz = measureFrom === 'left' ? hx : (L - hx);
        const endLabel = measureFrom === 'left' ? 'from left end' : 'from right end';
        return `
          <div class="hook-dims" style="margin-top:${hi===0?'3px':'8px'};">
            <div>
              <div class="hook-dim-label">Hook ${labels[hi]}, ${endLabel}</div>
              <div class="hook-dim-value">${fmt(horiz)} ${unit}</div>
            </div>
            <div>
              <div class="hook-dim-label">Hook height above floor</div>
              <div class="hook-dim-value">${fmt(p.hookHeight)} ${unit}</div>
            </div>
          </div>
        `;
      }).join('');
      return `
        <div class="hook-row">
          <div class="hook-num">${i+1}</div>
          <div class="hook-info">
            <div class="hook-size">${sizeLine} — 2 hooks, ${fmt(p.hookSpacing)} ${unit} apart</div>
            ${subRows}
          </div>
        </div>
      `;
    }
  }).join('');
}

resetSpacingToEven();
buildPictureFields();
buildGapFields();
render();
</script>
</body>
</html>
